---
- name: Load plaintext passwords (overrides vault if present)
  hosts: all
  gather_facts: false
  tags: always
  tasks:
    - name: Check for plaintext passwords
      ansible.builtin.stat:
        path: /etc/k3s-cluster/passwords.yaml
      register: plaintext_passwords
    - name: Load plaintext passwords
      ansible.builtin.include_vars:
        file: /etc/k3s-cluster/passwords.yaml
      when: plaintext_passwords.stat.exists

- name: Playbook Validation
  hosts: localhost
  become: false
  gather_facts: false
  tags: always
  tasks:
    - name: Validate tags
      ansible.builtin.fail:
        msg: |
          Improper usage of '--tags' flag:
          {% set valid_tags = global_map.tags.play + global_map.tags.charts %}
          {% set invalid_tags = ansible_run_tags | difference(valid_tags) %}
          {% if invalid_tags | length > 0 %}
            - invalid tag{% if invalid_tags | length > 1 %}s{% endif %}: {{ invalid_tags | join(', ') }}
          {% endif %}
            - valid tags: {{ valid_tags | join(', ') }}
      when:
        - ansible_run_tags not in [(), ('all',)]
        - ansible_run_tags | difference(global_map.tags.play + global_map.tags.charts) | length > 0

    - name: Validate version
      ansible.builtin.fail:
        msg: Invalid Ansible version, minimum requirement is '{{ global_map.ansible.version }}'.
      when: ansible_version.full is not version(global_map.ansible.version, '>=')

- name: Cluster Provisioning
  hosts: cluster
  become: true
  gather_facts: true
  environment: '{{ _proxy_environment }}'
  roles:
    - cluster
  tags: cluster

- name: LoadBalancer Provisioning
  hosts: cluster
  become: true
  gather_facts: true
  environment: '{{ _proxy_environment }}'
  tags:
    - cluster
    - kubernetes
  tasks:
    - name: Setup loadbalancer
      ansible.builtin.import_role:
        name: k3s
        tasks_from: loadbalancer

- name: Kubernetes Provisioning
  hosts: cluster
  become: true
  gather_facts: true
  environment: '{{ _proxy_environment }}'
  roles:
    - helm
    - k3s
  serial:
    - 1
    - 2
    - 5
  tags: kubernetes

- name: Charts Provisioning
  hosts: server
  become: true
  gather_facts: true
  environment: '{{ _proxy_environment }}'
  tags:
    - charts
    - cilium
    - multus
    - kube-ovn
    - coredns
    - cert-manager
    - external-dns
    - argo-cd
    - kured
    - longhorn
    - ceph-csi
    - metrics-server
    - victoria-logs
    - victoria-metrics
    - kubevirt
    - gpu-operator
  tasks:
    - name: Deploy chart roles
      ansible.builtin.include_role:
        name: '{{ role }}'
      loop: '{{ global_map.tags.charts }}'
      when:
        - (lookup('vars', 'enable_' ~ (role | replace('-', '_')), default=true)) | bool
        - (ansible_run_tags in [(), ('all',)]) or (role in ansible_run_tags)
      loop_control:
        loop_var: role
  post_tasks:
    - name: Perform post-install tasks
      ansible.builtin.include_role:
        name: '{{ postinstall }}'
        tasks_from: postinstall
      loop: '{{ global_map.tags.postinstall }}'
      when:
        - (lookup('vars', 'enable_' ~ (postinstall | replace('-', '_')), default=true)) | bool
        - (ansible_run_tags in [(), ('all',)]) or (postinstall in ansible_run_tags)
      loop_control:
        loop_var: postinstall
