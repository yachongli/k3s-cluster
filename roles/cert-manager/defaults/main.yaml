---
certmanager_vars:
  kubernetes:
    cainjector:
      resources: '{{ defaults.cluster.pod_resources.small }}'
    controller:
      replicas: 2
      resources: '{{ defaults.cluster.pod_resources.small }}'
    helm:
      chart:
        name: cert-manager
        version: '{{ cert_manager_chart_version | default("v1.20.2") }}'
      repository:
        name: cert-manager
        org: jetstack
        url: https://charts.jetstack.io
    global:
      log_level: 2
    namespace: kube-system
    webhook:
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.small }}'
  release:
    checksum: checksums.txt
    # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/server/#hardware), for details
    file: 'cmctl_linux_{{ defaults.cluster.architecture_binary | default("amd64") }}'
    repository:
      name: cmctl
      org: cert-manager
    version: '{{ cert_manager_cli_version | default("v2.4.1") }}'
