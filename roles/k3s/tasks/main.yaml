---
- name: Role Facts
  ansible.builtin.import_tasks:
    file: facts.yaml

- name: Kubelet Switch Precheck
  ansible.builtin.import_tasks:
    file: precheck.yaml

- name: Read token from server node-token file
  ansible.builtin.slurp:
    path: '{{ k3s_map.node.directory.data }}/server/node-token'
  delegate_to: '{{ k3s_map.server.default_host }}'
  register: _k3s_server_token
  ignore_errors: true
  no_log: true

- name: Read token from existing config (fallback)
  ansible.builtin.command:
    cmd: 'sed -n "s/^token:[[:space:]]*//p" {{ k3s_project.cluster.config }}'
  register: _k3s_config_token
  changed_when: false
  failed_when: false
  no_log: true

- name: Set token (always update from server or config)
  ansible.builtin.set_fact:
    k3s_project: '{{ k3s_project | combine({"cluster": {"token": _token}}, recursive=true) }}'
  vars:
    _server_token: '{{ _k3s_server_token.content | default("") | b64decode | trim }}'
    _config_token: '{{ _k3s_config_token.stdout | default("") | trim }}'
    _token: '{{ _server_token if _server_token | length > 0 else _config_token }}'
  when: _token | default("") | length > 0

- name: Role Provisioning
  notify: Start kubernetes service
  block:
    - name: Install k3s binary
      ansible.builtin.get_url:
        url: '{{ k3s_project.release.k3s.file }}'
        checksum: sha256:{{ k3s_project.release.k3s.checksum }}
        dest: '{{ k3s_node.binary }}'
        owner: root
        group: root
        mode: '755'
      register: k3s_result
      delay: 1
      retries: 3
      until: k3s_result is not failed

    - name: Create configuration directory
      ansible.builtin.file:
        path: '{{ k3s_map.node.directory.config }}'
        state: directory
        owner: root
        group: root
        mode: '755'

    - name: Set role postinstall fact
      ansible.builtin.set_fact:
        k3s_postinstall: false

    - name: Create configuration file
      ansible.builtin.template:
        src: config.j2
        dest: '{{ k3s_project.cluster.config }}'
        owner: root
        group: root
        mode: '600'

    - name: Create kubelet configuration file
      ansible.builtin.template:
        src: config_kubelet.j2
        dest: '{{ k3s_project.cluster.config_kubelet }}'
        owner: root
        group: root
        mode: '644'

    - name: Create service file
      ansible.builtin.template:
        src: service.j2
        dest: /etc/systemd/system/{{ k3s_node.service.name }}.service
        owner: root
        group: root
        mode: '644'

    - name: Create service environment file
      ansible.builtin.file:
        path: /etc/systemd/system/{{ k3s_node.service.name }}.service.env
        access_time: preserve
        modification_time: preserve
        state: touch
        owner: root
        group: root
        mode: '600'

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Role Configuration
  ansible.builtin.import_tasks:
    file: configuration.yaml

- name: Server Configuration
  notify: Restart kubernetes service
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Set role postinstall fact
      ansible.builtin.set_fact:
        k3s_postinstall: true

    - name: Update server configuration file
      ansible.builtin.template:
        src: config.j2
        dest: '{{ k3s_project.cluster.config }}'
        owner: root
        group: root
        mode: '600'
