---
# -- helm-diff plugin download URL. Default uses GitHub upstream. Override
# in globals.yaml when GitHub is slow or unreachable (e.g. China mainland).
helm_plugin_diff_url: 'https://github.com/databus23/helm-diff'

helm_vars:
  environment:
    HELM_NAMESPACE: default
  plugins:
    - name: diff
      enabled: true
      repository:
        url: '{{ helm_plugin_diff_url }}'
      version: '{{ helm_diff_plugin_version | default("v3.15.6") }}'
  release:
    helm:
      distro:
        channel: any
        name: debian
      key: helm-archive-keyring.gpg
      repository:
        channel: stable
        key: gpgkey
        url: https://packages.buildkite.com/helm-linux/helm-debian
      version: '{{ helm_version | default("v3.20.0-1") }}'
