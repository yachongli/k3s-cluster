---
- name: Set map fact
  ansible.builtin.set_fact:
    kubeovn_map:
      helm:
        chart:
          reference: '{{ kubeovn_vars.kubernetes.helm.repository.org }}/{{ kubeovn_vars.kubernetes.helm.chart.name }}'
          version: '{{ kubeovn_vars.kubernetes.helm.chart.version[1:] }}'
        platform:
          key: https://github.com
          raw: https://raw.githubusercontent.com
        repository:
          name: '{{ kubeovn_vars.kubernetes.helm.repository.org }}/{{ kubeovn_vars.kubernetes.helm.repository.name }}'
          url: '{{ kubeovn_vars.kubernetes.helm.repository.url }}/{{ kubeovn_vars.kubernetes.helm.repository.name }}'
        timeout: 10m0s
      metrics:
        service:
          monitor:
            enabled: true
            scrape:
              # If `null`, default value is `victoriametrics_map.service.monitor.scrape.interval`
              interval: null
              # If `null`, default value is `victoriametrics_map.service.monitor.scrape.timeout`
              timeout: null
  run_once: true

- name: Set project fact
  ansible.builtin.set_fact:
    kubeovn_project:
      tag: '{{ kubeovn_vars.kubernetes.helm.chart.version }}'
      url: '{{ kubeovn_map.helm.platform.key }}/{{ kubeovn_map.helm.repository.name }}/releases/tag'
  run_once: true

- name: Set variables fact
  ansible.builtin.set_fact:
    kubeovn_vars: '{{ kubeovn_vars }}'
  run_once: true
