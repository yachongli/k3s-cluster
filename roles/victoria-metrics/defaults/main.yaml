---
victoriametrics_vars:
  kubernetes:
    # -- Pin all stateful VM Pods to a subset of nodes. Empty maps/lists mean
    # "no constraint". Overridable via globals.yaml:
    #   victoria_metrics_node_selector: {workload: storage}
    #   victoria_metrics_tolerations: [{key: dedicated, value: storage, effect: NoSchedule}]
    pin:
      node_selector: '{{ victoria_metrics_node_selector | default(defaults.victoria_metrics.node_selector) }}'
      tolerations: '{{ victoria_metrics_tolerations | default(defaults.victoria_metrics.tolerations) }}'
    alertmanager:
      config:
        route:
          # -- Delay between additional notifications for new alerts added to an existing group
          group_interval: 30m
          # -- Collection period for grouping alerts before sending initial notification
          group_wait: 15m
          # -- Minimum interval between repeat notifications for unresolved alerts
          repeat_interval: 12h
      config_reloader:
        resources: '{{ defaults.cluster.pod_resources.small }}'
      ingress:
        enabled: true
        # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
        subdomain: alertmanager
      log_level: WARN
      # -- Minimum accepted value is `2`
      replicas: 2
      resources: '{{ defaults.cluster.pod_resources.small }}'
      storage:
        enabled: false
        access_modes:
          - ReadWriteOnce
        class: '{{ victoria_metrics_storage_class | default(defaults.victoria_metrics.storage_class) }}'
        size: '{{ victoria_metrics_aux_storage_size | default(defaults.victoria_metrics.aux_storage_size) }}'
    default_dashboards:
      timezone: utc
    helm:
      chart:
        prometheus:
          name: prometheus-operator-crds
          version: '{{ victoria_metrics_prometheus_chart_version | default("v28.0.1") }}'
        operator:
          name: victoria-metrics-operator
        victoriametrics:
          alias: vmks
          name: victoria-metrics-k8s-stack
          version: '{{ victoria_metrics_chart_version | default("v0.74.1") }}'
      repository:
        grafana:
          name: helm-charts
          org: grafana
          url: https://grafana.github.io
        prometheus:
          name: helm-charts
          org: prometheus-community
          url: https://prometheus-community.github.io
        victoriametrics:
          name: helm-charts
          org: VictoriaMetrics
          url: https://victoriametrics.github.io
    grafana:
      ingress:
        enabled: true
        # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
        subdomain: grafana
      ini:
        security:
          unsigned_plugins:
            - grafana-lokiexplore-app
      log_level: WARN
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.medium }}'
      sidecar:
        log_level: WARN
        resources: '{{ defaults.cluster.pod_resources.small }}'
      storage:
        enabled: true
        access_modes:
          - ReadWriteOnce
        class: '{{ victoria_metrics_storage_class | default(defaults.victoria_metrics.storage_class) }}'
        size: '{{ victoria_metrics_aux_storage_size | default(defaults.victoria_metrics.aux_storage_size) }}'
      user:
        # -- (string) User name used to access Grafana UI
        # @default -- Set value into [all.yaml](../../inventory/cluster/group_vars/all/main.yaml) `credentials` collection
        name:
        # -- (string) User password used to access Grafana UI
        # @default -- Set value into [all.yaml](../../inventory/cluster/group_vars/all/main.yaml) `credentials` collection
        password:
    kube_state_metrics:
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.small }}'
    namespace: '{{ defaults.victoria_metrics.namespace }}'
    victoria_metrics_operator:
      # -- Available options are `info` and `error`
      log_level: error
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.small }}'
    prometheus_node_exporter:
      resources: '{{ defaults.cluster.pod_resources.small }}'
    vmagent:
      config_reloader:
        resources: '{{ defaults.cluster.pod_resources.small }}'
      ingress:
        enabled: true
        # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
        subdomain: agent
      log_level: WARN
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.large }}'
      storage:
        enabled: false
        access_modes:
          - ReadWriteOnce
        class: '{{ victoria_metrics_storage_class | default(defaults.victoria_metrics.storage_class) }}'
        size: '{{ victoria_metrics_aux_storage_size | default(defaults.victoria_metrics.aux_storage_size) }}'
    vmalert:
      config_reloader:
        resources: '{{ defaults.cluster.pod_resources.small }}'
      ingress:
        enabled: true
        # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
        subdomain: alert
      log_level: WARN
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.small }}'
    vmcluster:
      # -- If false, `vmsingle` settings are used
      enabled: '{{ victoria_metrics_cluster_enabled | default(defaults.victoria_metrics.cluster_enabled) }}'
      replication_factor: 2
      retention_period: '{{ victoria_metrics_retention | default(defaults.victoria_metrics.retention) }}'
      vminsert:
        hpa:
          enabled: true
          min_replicas: 2
          max_replicas: 4
          resource:
            name: memory
            target:
              utilization: 80
        ingress:
          enabled: false
          # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
          subdomain: insert
        log_level: WARN
        resources: '{{ defaults.cluster.pod_resources.large }}'
      vmselect:
        hpa:
          enabled: true
          min_replicas: 2
          max_replicas: 4
          resource:
            name: memory
            target:
              utilization: 80
        ingress:
          enabled: true
          # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
          subdomain: metrics
        log_level: WARN
        resources: '{{ defaults.cluster.pod_resources.large }}'
        storage:
          enabled: false
          access_modes:
            - ReadWriteOnce
          class: '{{ victoria_metrics_storage_class | default(defaults.victoria_metrics.storage_class) }}'
          size: '{{ victoria_metrics_aux_storage_size | default(defaults.victoria_metrics.aux_storage_size) }}'
      vmstorage:
        ingress:
          enabled: false
          # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
          subdomain: storage
        log_level: WARN
        replicas: 1
        resources: '{{ defaults.cluster.pod_resources.large }}'
        storage:
          enabled: true
          access_modes:
            - ReadWriteOnce
          class: '{{ victoria_metrics_storage_class | default(defaults.victoria_metrics.storage_class) }}'
          size: '{{ victoria_metrics_storage_size | default(defaults.victoria_metrics.storage_size) }}'
    vmsingle:
      ingress:
        enabled: true
        # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
        subdomain: metrics
      log_level: WARN
      replicas: 1
      resources: '{{ defaults.cluster.pod_resources.large }}'
      retention_period: '{{ victoria_metrics_retention | default(defaults.victoria_metrics.retention) }}'
      storage:
        enabled: true
        access_modes:
          - ReadWriteOnce
        class: '{{ victoria_metrics_storage_class | default(defaults.victoria_metrics.storage_class) }}'
        size: '{{ victoria_metrics_storage_size | default(defaults.victoria_metrics.storage_size) }}'
