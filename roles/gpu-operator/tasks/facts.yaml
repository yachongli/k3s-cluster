---
- name: Set map fact
  ansible.builtin.set_fact:
    gpuoperator_map:
      helm:
        chart:
          reference: '{{ gpuoperator_vars.kubernetes.helm.repository.org }}/{{ gpuoperator_vars.kubernetes.helm.chart.name }}'
          version: '{{ gpuoperator_vars.kubernetes.helm.chart.version[1:] }}'
        platform:
          key: https://github.com
          raw: https://raw.githubusercontent.com
        repository:
          name: '{{ gpuoperator_vars.kubernetes.helm.repository.org }}/{{ gpuoperator_vars.kubernetes.helm.repository.name }}'
          url: '{{ gpuoperator_vars.kubernetes.helm.repository.url }}'
        timeout: 10m0s
      metrics:
        service:
          monitor:
            enabled: true
            scrape:
              # If `null`, default value is `victoriametrics_map.service.monitor.scrape.interval`
              interval: null
              # If `null`, default value is `victoriametrics_map.service.monitor.scrape.timeout`
              timeout: null
  run_once: true

- name: Set project fact
  ansible.builtin.set_fact:
    gpuoperator_project:
      tag: '{{ gpuoperator_vars.kubernetes.helm.chart.version }}'
      url: '{{ gpuoperator_map.helm.platform.key }}/{{ gpuoperator_map.helm.repository.name }}/releases/tag'
  run_once: true

- name: Set variables fact
  ansible.builtin.set_fact:
    gpuoperator_vars: '{{ gpuoperator_vars }}'
  run_once: true
