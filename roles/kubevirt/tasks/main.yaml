---
- name: Role Facts
  ansible.builtin.include_role:
    name: '{{ role }}'
    tasks_from: facts
  loop:
    - k3s
    - victoria-metrics
    - kubevirt
  loop_control:
    loop_var: role

- name: Role Provisioning
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Validate service state
      ansible.builtin.wait_for:
        port: '{{ k3s_vars.server.api.port }}'
        timeout: 30
      any_errors_fatal: true

    - name: Chart Setup
      run_once: true
      block:
        - name: Set chart postinstall fact
          ansible.builtin.set_fact:
            kubevirt_postinstall: false

        - name: Download operator manifest
          ansible.builtin.get_url:
            url: '{{ kubevirt_project.release.url }}/{{ kubevirt_map.manifest.operator }}'
            dest: '{{ k3s_map.node.directory.config }}/kubevirt-operator.yaml'
            owner: root
            group: root
            mode: '600'
          register: kubevirt_result
          delay: 1
          retries: 3
          until: kubevirt_result is not failed

        - name: Apply operator manifest
          kubernetes.core.k8s:
            src: '{{ k3s_map.node.directory.config }}/kubevirt-operator.yaml'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
          register: kubevirt_result
          delay: 1
          retries: 3
          until: kubevirt_result is not failed

        - name: Wait for KubeVirt CRD establishment
          kubernetes.core.k8s_info:
            kind: CustomResourceDefinition
            name: kubevirts.kubevirt.io
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
            wait_timeout: 120
            wait_condition:
              type: Established
              status: 'True'
          register: kubevirt_result
          delay: 1
          retries: 3
          until: kubevirt_result is not failed

        - name: Apply KubeVirt custom resource
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'kubevirt_cr.j2') | from_yaml }}"
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
          register: kubevirt_result
          delay: 1
          retries: 3
          until: kubevirt_result is not failed

        - name: Wait for KubeVirt resource readiness
          kubernetes.core.k8s_info:
            api_version: kubevirt.io/v1
            kind: KubeVirt
            name: kubevirt
            namespace: '{{ kubevirt_vars.kubernetes.namespace }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
            wait_timeout: 600
            wait_condition:
              type: Available
              status: 'True'
          register: kubevirt_result
          delay: 5
          retries: 60
          until: kubevirt_result is not failed

        - name: Network Policies Setup
          when: kubevirt_vars.kubernetes.network_policies.enabled is truthy
          block:
            - name: Download network policies manifest
              ansible.builtin.get_url:
                url: '{{ kubevirt_project.release.url }}/{{ kubevirt_map.manifest.network_policies }}'
                dest: '{{ k3s_map.node.directory.config }}/kubevirt-network-policies.yaml'
                owner: root
                group: root
                mode: '600'
              register: kubevirt_result
              delay: 1
              retries: 3
              until: kubevirt_result is not failed

            - name: Apply network policies manifest
              kubernetes.core.k8s:
                src: '{{ k3s_map.node.directory.config }}/kubevirt-network-policies.yaml'
                kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
                namespace: '{{ kubevirt_vars.kubernetes.namespace }}'
                wait: true
              register: kubevirt_result
              delay: 1
              retries: 3
              until: kubevirt_result is not failed

        - name: Install virtctl binary
          ansible.builtin.get_url:
            url: '{{ kubevirt_project.release.url }}/{{ kubevirt_project.release.file }}'
            dest: '{{ k3s_map.node.directory.bin }}/virtctl'
            owner: root
            group: root
            mode: '755'
          register: kubevirt_result
          delay: 1
          retries: 3
          until: kubevirt_result is not failed
