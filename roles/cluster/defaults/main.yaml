---
# -- System-wide HTTP/HTTPS proxy for helm, git, and containerd. Set in
# globals.yaml when target hosts need to reach external services through
# a proxy (e.g. China mainland). no_proxy must include cluster-internal
# ranges to avoid routing internal traffic through the proxy.
# This is PERSISTENT — written to /etc/profile.d, systemd drop-ins, and
# git config. To remove, clear the variable and re-run the playbook.
cluster_http_proxy: ''
cluster_https_proxy: ''
cluster_no_proxy: []

# -- Temporary deploy-time proxy. Set in globals.yaml when only the
# Ansible run needs a proxy (helm/git downloads). Not written to target
# hosts — injected via `environment` at play level, gone after playbook
# finishes. Use this when you don't want a permanent proxy on the hosts.
cluster_deploy_proxy: ''

# -- Route apt traffic through the deploy proxy. Default false — apt
# bypasses the proxy and connects directly to Ubuntu mirrors. Set to
# true if your Ubuntu mirrors are also behind the proxy.
cluster_apt_proxy: false

cluster_vars:
  device:
    # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/server/#storage-devices), for details
    enabled: '{{ cluster_device_enabled | default(false) }}'
    # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/server/#deviceid), for details
    id: '2:2'
    # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/server/#devicename), for details
    name: 'ASMedia Technology'
  hardware:
    # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/server/#hardware), for details
    architecture: '{{ cluster_architecture | default(defaults.cluster.architecture) }}'
  lsb:
    # -- Linux Standard Base distribution ID
    id: Ubuntu
    # -- Linux Standard Base distribution release
    release: 24.04
  service:
    bluetooth:
      # -- By default, related `apt` packages are not installed
      enabled: false
    cloud_init:
      enabled: false
    postfix:
      enabled: '{{ cluster_postfix_enabled | default(defaults.cluster.postfix_enabled) }}'
      protocols: ipv4
      relay:
        # -- iCloud mail server relay host
        host: smtp.mail.me.com
        port: 587
      # -- (string) Postfix user credentials, set at global level
      # @default -- Set values into [all.yaml](../../inventory/cluster/group_vars/all/main.yaml) `credentials` collection
      user:
    snapd:
      enabled: false
    unattended_upgrades:
      # -- See [documentation](https://help.ubuntu.com/community/AutomaticSecurityUpdates), for details
      enabled: '{{ cluster_unattended_upgrades_enabled | default(defaults.cluster.unattended_upgrades_enabled) }}'
      # -- Available options are `always`, `on-change` and `only-on-error`
      mail_report: only-on-error
      remove_deps: 'true'
    wifi:
      # -- By default, related `apt` packages are not installed
      enabled: false
  ssh:
    # -- See [documentation](https://axivo.com/k3s-cluster/wiki/guide/configuration/user/#ssh-key), for details
    key: id_ed25519.pub
    # -- Full path to `.ssh` directory, a hardcoded value can be used
    path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
