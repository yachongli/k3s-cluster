---
externaldns_vars:
  cloudflare:
    acme:
      # -- Available options are [`production`](https://letsencrypt.org/docs/rate-limits/)
      # and [`staging`](https://letsencrypt.org/docs/staging-environment/)
      server: '{{ external_dns_acme_server | default(defaults.external_dns.acme_server) }}'
    host:
      # -- See [documentation](https://axivo.com/k3s-cluster/tutorials/handbook/externaldns/#front-ends), for details
      domain: '{{ external_dns_domain | default(defaults.external_dns.domain) }}'
    prefix: cloudflare
  kubernetes:
    helm:
      chart:
        name: external-dns
        version: '{{ external_dns_chart_version | default("v1.20.0") }}'
      repository:
        name: external-dns
        org: kubernetes-sigs
        url: https://kubernetes-sigs.github.io
    log_level: warning
    namespace: kube-system
    policy: sync
    resources: '{{ defaults.cluster.pod_resources.small }}'
