---
- name: Load plaintext passwords (overrides vault if present)
  hosts: all
  gather_facts: false
  tags: always
  tasks:
    - name: Check for plaintext passwords
      ansible.builtin.stat:
        path: /etc/k3s-cluster/passwords.yaml
      register: plaintext_passwords
    - name: Load plaintext passwords
      ansible.builtin.include_vars:
        file: /etc/k3s-cluster/passwords.yaml
      when: plaintext_passwords.stat.exists

- name: Playbook Validation
  hosts: localhost
  become: false
  gather_facts: false
  tags: always
  tasks:
    - name: Validate tags
      ansible.builtin.fail:
        msg: |
          Improper usage of '--tags' flag:
          {% set invalid_tags = ansible_run_tags | difference(global_map.tags.role) %}
          {% if invalid_tags | length > 0 %}
            - invalid tag{% if invalid_tags | length > 1 %}s{% endif %}: {{ invalid_tags | join(', ') }}
          {% endif %}
            - valid tags: {{ global_map.tags.role | join(', ') }}
      when:
        - ansible_run_tags not in [(), ('all',)]
        - ansible_run_tags | difference(global_map.tags.role) | length > 0

    - name: Validate version
      ansible.builtin.fail:
        msg: Invalid Ansible version, minimum requirement is '{{ global_map.ansible.version }}'.
      when: ansible_version.full is not version(global_map.ansible.version, '>=')

- name: Cluster Upgrade
  hosts: cluster
  become: true
  gather_facts: true
  environment: '{{ _proxy_environment }}'
  tasks:
    - name: Ensure helm is installed (idempotent)
      ansible.builtin.import_role:
        name: helm

    - name: Role Upgrade
      ansible.builtin.include_role:
        apply:
          tags: '{{ upgrade }}'
        name: '{{ upgrade }}'
        tasks_from: upgrade
      loop: '{{ global_map.tags.role }}'
      loop_control:
        loop_var: upgrade
      tags: always
      when:
        - (upgrade in ansible_run_tags)
        - (lookup('vars', 'enable_' ~ (upgrade | replace('-', '_')), default=true)) | bool
